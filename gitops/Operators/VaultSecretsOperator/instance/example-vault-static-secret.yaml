# Example VaultStaticSecret - uncomment and modify to sync secrets from Vault
#
# This example shows how to sync a secret from Vault to a Kubernetes Secret.
# The secret will be created in the same namespace as this VaultStaticSecret resource.
#
# apiVersion: secrets.hashicorp.com/v1beta1
# kind: VaultStaticSecret
# metadata:
#   name: example-vault-secret
#   namespace: default
# spec:
#   # Reference to VaultConnection (in vault namespace)
#   vaultConnectionRef: vault-connection
#
#   # Namespace where VaultConnection exists
#   namespace: vault
#
#   # Authentication method (in vault namespace)
#   vaultAuthRef: vault-auth
#
#   # Path to secret in Vault (for KV v2, use: secret/data/path/to/secret)
#   mount: secret
#   type: kv-v2
#   path: example/secret
#
#   # Destination Kubernetes Secret
#   destination:
#     name: example-k8s-secret
#     create: true
#
#   # Refresh interval
#   refreshAfter: 30s
#
#   # Rollout restart for deployments using this secret
#   rolloutRestartTargets:
#     - kind: Deployment
#       name: example-deployment
